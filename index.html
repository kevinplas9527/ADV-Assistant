<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ADV小助手 · 工程塑料重量计算</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="app-header">
      <img class="logo-img" src="assets/logo.png" alt="艾达威科技 ADV">
      <div>
        <h1>工程塑料重量计算</h1>
        <p class="subtitle">板 · 棒 · 管 重量与成本快速测算</p>
      </div>
    </header>

    <nav class="app-tabs">
      <button class="app-tab active" data-tab="weight">重量测算</button>
      <button class="app-tab" data-tab="cut">切割测算</button>
    </nav>

    <main class="main">
      <section id="page-weight">
      <!-- 材料与形态 -->
      <section class="card">
        <h2>① 材料与形态</h2>
        <div class="form-grid">
          <div class="field">
            <label for="material">材料</label>
            <select id="material">
              <option value="2.20">PTFE 聚四氟乙烯</option>
              <option value="2.15">PFA 全氟烷氧基树脂</option>
              <option value="1.78">PVDF 聚偏氟乙烯</option>
              <option value="1.32">PEEK 聚醚醚酮</option>
              <option value="1.35">PPS 聚苯硫醚</option>
              <option value="1.40">PI 聚酰亚胺</option>
              <option value="1.41">POM 聚甲醛（赛钢）</option>
              <option value="1.14">PA6 尼龙6</option>
              <option value="1.15">PA66 尼龙66</option>
              <option value="1.16">MC尼龙（铸型尼龙）</option>
              <option value="1.20">PC 聚碳酸酯</option>
              <option value="1.19">PMMA 亚克力</option>
              <option value="1.05">ABS</option>
              <option value="0.96">HDPE 高密度聚乙烯</option>
              <option value="0.93">UHMWPE 超高分子量聚乙烯</option>
              <option value="0.91">PP 聚丙烯</option>
              <option value="1.45">PVC 硬质聚氯乙烯</option>
            </select>
          </div>
          <div class="field">
            <label for="density">密度（g/cm³）</label>
            <input type="number" id="density" value="2.20" step="0.01" min="0.01">
          </div>
        </div>

        <div class="shape-tabs">
          <button class="shape-btn active" data-shape="plate">
            <img class="shape-icon" src="assets/icon-plate.svg" alt="板材">
            <span>板材</span>
          </button>
          <button class="shape-btn" data-shape="rod">
            <img class="shape-icon" src="assets/icon-rod.svg" alt="棒材">
            <span>棒材</span>
          </button>
          <button class="shape-btn" data-shape="tube">
            <img class="shape-icon" src="assets/icon-tube.svg" alt="管材">
            <span>管材</span>
          </button>
        </div>

        <!-- 板材 -->
        <div class="shape-form" id="form-plate">
          <div class="form-grid three">
            <div class="field">
              <label for="plate-l">长（mm）</label>
              <input type="number" id="plate-l" placeholder="如 1000" min="0">
            </div>
            <div class="field">
              <label for="plate-w">宽（mm）</label>
              <input type="number" id="plate-w" placeholder="如 500" min="0">
            </div>
            <div class="field">
              <label for="plate-t">厚（mm）</label>
              <input type="number" id="plate-t" placeholder="如 20" min="0">
            </div>
          </div>
        </div>

        <!-- 棒材 -->
        <div class="shape-form hidden" id="form-rod">
          <div class="form-grid two">
            <div class="field">
              <label for="rod-d">直径（mm）</label>
              <input type="number" id="rod-d" placeholder="如 50" min="0">
            </div>
            <div class="field">
              <label for="rod-l">长度（mm）</label>
              <input type="number" id="rod-l" placeholder="如 1000" min="0">
            </div>
          </div>
        </div>

        <!-- 管材 -->
        <div class="shape-form hidden" id="form-tube">
          <div class="mode-tabs">
            <button class="mode-btn active" data-tube-mode="od-id">按内外径</button>
            <button class="mode-btn" data-tube-mode="od-wall">按外径壁厚</button>
          </div>
          <div class="form-grid three" id="tube-od-id">
            <div class="field">
              <label for="tube-od">外径（mm）</label>
              <input type="number" id="tube-od" placeholder="如 100" min="0">
            </div>
            <div class="field">
              <label for="tube-id">内径（mm）</label>
              <input type="number" id="tube-id" placeholder="如 80" min="0">
            </div>
            <div class="field">
              <label for="tube-l">长度（mm）</label>
              <input type="number" id="tube-l" placeholder="如 1000" min="0">
            </div>
          </div>
          <div class="form-grid three hidden" id="tube-od-wall">
            <div class="field">
              <label for="tube-od2">外径（mm）</label>
              <input type="number" id="tube-od2" placeholder="如 100" min="0">
            </div>
            <div class="field">
              <label for="tube-wall">壁厚（mm）</label>
              <input type="number" id="tube-wall" placeholder="如 10" min="0">
            </div>
            <div class="field">
              <label for="tube-l2">长度（mm）</label>
              <input type="number" id="tube-l2" placeholder="如 1000" min="0">
            </div>
          </div>
        </div>
      </section>

      <!-- 报价参数 -->
      <section class="card">
        <h2>② 报价参数（可选）</h2>
        <div class="form-grid two">
          <div class="field">
            <label for="price">材料单价（元/kg）</label>
            <input type="number" id="price" placeholder="如 80" min="0">
          </div>
          <div class="field">
            <label for="qty">数量（件）</label>
            <input type="number" id="qty" value="1" min="1">
          </div>
        </div>
      </section>

      <!-- 结果 -->
      <section class="card result-card">
        <h2>③ 计算结果</h2>
        <button id="calc-btn" class="calc-btn">计 算</button>
        <div id="solve-msg" class="solve-msg hidden"></div>
        <div id="result" class="result hidden">
          <div class="result-grid">
            <div class="result-item">
              <div class="result-label">单件体积</div>
              <div class="result-value" id="res-volume">-</div>
              <div class="result-unit">cm³</div>
            </div>
            <div class="result-item solve-weight-item">
              <div class="result-label">单件重量（可修改反算）</div>
              <input type="number" id="target-weight" class="result-input" placeholder="22" min="0">
              <div class="result-unit">kg</div>
            </div>
            <div class="result-item">
              <div class="result-label">总重量</div>
              <div class="result-value" id="res-total-w">-</div>
              <div class="result-unit">kg</div>
            </div>
            <div class="result-item" id="cost-item">
              <div class="result-label">材料成本</div>
              <div class="result-value" id="res-cost">-</div>
              <div class="result-unit">元</div>
            </div>
          </div>
          <div class="formula" id="res-formula"></div>
          <button id="copy-btn" class="ghost-btn hidden">复制结果</button>
        </div>
      </section>
      </section>

      <!-- 切割测算 -->
      <section id="page-cut" class="hidden">
        <section class="card">
          <h2>① 切割参数</h2>
          <div class="shape-tabs cut-type-tabs">
            <button class="shape-btn active" data-cuttype="plate" id="cuttype-plate">板材切割</button>
            <button class="shape-btn" data-cuttype="rod" id="cuttype-rod">棒/管切割</button>
          </div>
          <div id="cut-panel-plate">
            <div class="form-grid two">
              <div class="field">
                <label for="cut-plate-l">板材长（mm）</label>
                <input type="number" id="cut-plate-l" placeholder="如 1000" min="0">
              </div>
              <div class="field">
                <label for="cut-plate-w">板材宽（mm）</label>
                <input type="number" id="cut-plate-w" placeholder="如 1200" min="0">
              </div>
            </div>
            <div class="form-grid two">
              <div class="field">
                <label for="cut-block-l">块长（mm）</label>
                <input type="number" id="cut-block-l" placeholder="如 90" min="0">
              </div>
              <div class="field">
                <label for="cut-block-w">块宽（mm）</label>
                <input type="number" id="cut-block-w" placeholder="如 100" min="0">
              </div>
            </div>
            <div class="form-grid two">
              <div class="field">
                <label for="cut-thickness">板材厚度（mm）</label>
                <input type="number" id="cut-thickness" placeholder="如 20" min="0">
              </div>
              <div class="field">
                <label for="cut-kerf">刀缝（mm）</label>
                <input type="number" id="cut-kerf" placeholder="推荐 4（按厚度）" min="0">
              </div>
            </div>
            <div class="form-grid">
              <div class="field">
                <label for="cut-target-n">目标块数（反算用）</label>
                <input type="number" id="cut-target-n" placeholder="留空按常规测算" min="0">
              </div>
            </div>
            <button id="cut-btn" class="calc-btn">测算</button>
          </div>
          <div id="cut-panel-rod" class="hidden">
            <div class="form-grid two">
              <div class="field">
                <label for="rod-len">材料长度（mm）</label>
                <input type="number" id="rod-len" placeholder="如 1000" min="0">
              </div>
              <div class="field">
                <label for="rod-dia">直径（mm）</label>
                <input type="number" id="rod-dia" placeholder="如 50" min="0">
              </div>
            </div>
            <div class="form-grid two">
              <div class="field">
                <label for="rod-piece">单件长度（mm）</label>
                <input type="number" id="rod-piece" placeholder="如 40" min="0">
              </div>
              <div class="field">
                <label for="rod-clamp">夹持长度（mm）</label>
                <input type="number" id="rod-clamp" placeholder="推荐 20" min="0">
              </div>
            </div>
            <div class="form-grid two">
              <div class="field">
                <label for="rod-kerf">刀缝（mm）</label>
                <input type="number" id="rod-kerf" placeholder="如 3" min="0">
              </div>
              <div class="field">
                <label for="rod-target-n">目标件数（反算用）</label>
                <input type="number" id="rod-target-n" placeholder="留空按常规测算" min="0">
              </div>
            </div>
            <button id="rod-btn" class="calc-btn">测算</button>
          </div>
        </section>
        <section class="card cut-result-card hidden" id="cut-result-card">
          <h2>② 测算结果</h2>
          <div class="solve-msg hidden" id="cut-msg"></div>
          <div class="cut-summary" id="cut-summary"></div>
          <canvas id="cut-canvas" class="cut-canvas"></canvas>
        </section>
        <section class="card cut-result-card hidden" id="rod-result-card">
          <h2>② 测算结果</h2>
          <div class="solve-msg hidden" id="rod-msg"></div>
          <div class="cut-summary" id="rod-summary"></div>
          <canvas id="rod-canvas" class="cut-canvas"></canvas>
        </section>
      </section>
    </main>

    <footer class="app-footer">
      <div class="slogan">advanced plastics for better life</div>
      <div class="footer-note">ADV小助手 · 密度为常用参考值，请按实际牌号核对</div>
      <div class="footer-note">本工具测算结果仅供参考，不构成交货承诺；实际密度、损耗与加工以实测确认为准</div>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
